# Builds the app for Linux, Windows and macOS when a version tag (v1.0.0...)
# is pushed, and attaches the files to that GitHub release.
# Linux is tested first. One publish job runs only after all three builds,
# so a failed build cannot leave a release with a missing download.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: an older glibc, so the Linux binary runs on more distributions.
          - os: ubuntu-22.04
            target: linux
            file: lingua-onde-linux-x86_64
          - os: windows-latest
            target: windows
            file: lingua-onde-windows-x86_64.exe
          - os: macos-14
            target: macos
            file: lingua-onde-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --release --locked
      - name: Static C runtime
        if: runner.os == 'Windows'
        shell: bash
        # one file, no separate Visual C++ install for the people who download it
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              cp target/release/lingua_onde "${{ matrix.file }}"
              ;;
            Windows)
              cp target/release/lingua_onde.exe "${{ matrix.file }}"
              ;;
            macOS)
              app="Lingua Onde.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp target/release/lingua_onde "$app/MacOS/lingua_onde"
              chmod +x "$app/MacOS/lingua_onde"
              ver="${GITHUB_REF_NAME#v}"
              cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Lingua Onde</string>
            <key>CFBundleDisplayName</key><string>Lingua Onde</string>
            <key>CFBundleIdentifier</key><string>io.github.matteo404404.lingua-onde</string>
            <key>CFBundleExecutable</key><string>lingua_onde</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${ver}</string>
            <key>CFBundleVersion</key><string>${ver}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
              ditto -c -k --keepParent "Lingua Onde.app" "${{ matrix.file }}"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  publish:
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check downloads
        run: |
          test -f dist/lingua-onde-linux-x86_64
          test -f dist/lingua-onde-windows-x86_64.exe
          test -f dist/lingua-onde-macos-arm64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lingua-onde-linux-x86_64
            dist/lingua-onde-windows-x86_64.exe
            dist/lingua-onde-macos-arm64.zip
